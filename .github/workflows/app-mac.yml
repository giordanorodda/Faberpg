# Builds the desktop app for macOS (Apple Silicon and Intel) and attaches it
# to the workflow run as a downloadable zip. Start it by hand from the
# Actions tab ("Run workflow"), or push to the 3D branch.
name: App per macOS

on:
  workflow_dispatch:
  push:
    branches: [prova-stile-cartoon]
    paths-ignore: ['docs/**', 'screenshots/**', '**.md']

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npx vite build
      # not signed: on first launch, right-click the app and choose "Apri"
      - run: npx electron-builder --mac zip --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: un-piccolo-mondo-mac
          path: release/*.zip
          retention-days: 30
