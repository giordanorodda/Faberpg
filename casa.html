<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La casa</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; color: #f1ead8; }
      #view { display: block; width: 100vw; height: 100vh; }
      #intro { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(10, 8, 6, 0.55); cursor: pointer; text-align: center; transition: opacity 0.6s; }
      #intro.hidden { opacity: 0; pointer-events: none; }
      #intro h1 { font-weight: normal; font-style: italic; font-size: 2.4em; margin: 0 0 0.3em; }
      #intro p { margin: 0.2em; color: #c9bfa6; }
      #intro .start { margin-top: 1.4em; color: #e2c27a; letter-spacing: 0.06em; }
      #cross { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: rgba(255, 255, 255, 0.45); transition: transform 0.2s, background 0.2s; }
      #cross.active { transform: scale(1.8); background: rgba(240, 210, 140, 0.9); }
      #time { position: fixed; right: 22px; top: 18px; font-style: italic; text-shadow: 0 1px 3px #000; color: #e8dfc8; }
      #toast { position: fixed; left: 50%; bottom: 8%; transform: translateX(-50%); max-width: 640px; padding: 0.8em 1.2em; background: rgba(28, 24, 20, 0.78); border: 1px solid rgba(201, 191, 166, 0.3); border-radius: 4px; line-height: 1.45; opacity: 0; transition: opacity 0.8s; }
      #toast.show { opacity: 1; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="cross"></div>
    <div id="time"></div>
    <div id="toast"></div>
    <div id="intro">
      <h1>La casa</h1>
      <p>WASD per camminare · il mouse per guardare · E per osservare, accendere, sedersi, dormire</p>
      <p>clic (o F) per prendere e posare le cose leggere · Q/R per girarle</p>
      <p>1–5: alba, mattina, pomeriggio, tramonto, notte · Esc per fermarti</p>
      <p class="start">Clicca per entrare</p>
    </div>
    <script type="module" src="/src/casa/main.ts"></script>
  </body>
</html>
